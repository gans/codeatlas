name: codeatlas
services:
  minio:
    image: cgr.dev/chainguard/minio@sha256:${MINIO_DIGEST:?set reviewed MINIO digest}
    pull_policy: never
    command: server /data --console-address :9001
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    networks: [default, client]
    ports: ["127.0.0.1:9000:9000", "127.0.0.1:9001:9001"]
    volumes: ["minio-data:/data"]
  postgres:
    image: postgres@sha256:${POSTGRES_DIGEST:?set reviewed POSTGRES digest}
    pull_policy: never
    environment:
      POSTGRES_DB: metastore
      POSTGRES_USER: hive
      POSTGRES_PASSWORD: hive
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hive -d metastore"]
      interval: 5s
      timeout: 5s
      retries: 20
    volumes: ["postgres-data:/var/lib/postgresql/data"]
  metastore:
    image: apache/hive@sha256:${HIVE_DIGEST:?set reviewed HIVE digest}
    pull_policy: never
    environment:
      SERVICE_NAME: metastore
      DB_DRIVER: postgres
      HADOOP_CLASSPATH: /opt/hadoop/share/hadoop/tools/lib/hadoop-aws-3.4.1.jar
      HADOOP_OPTIONAL_TOOLS: hadoop-aws
    volumes:
      - type: bind
        source: ./verified/postgresql.jar
        target: /opt/hive/lib/postgresql.jar
        read_only: true
        bind: {create_host_path: false}
      - ./verified/hadoop/bundle-2.24.6.jar:/opt/hive/lib/aws-sdk-bundle.jar:ro
      - ./config/hive/metastore-site.xml:/opt/hive/conf/metastore-site.xml:ro
    depends_on:
      postgres: {condition: service_healthy}
  trino:
    image: trinodb/trino@sha256:${TRINO_DIGEST:?set reviewed TRINO digest}
    pull_policy: never
    networks: [default, client]
    ports: ["127.0.0.1:8080:8080"]
    volumes:
      - ./config/trino/catalog:/etc/trino/catalog:ro
    depends_on: [metastore, minio]
volumes:
  minio-data:
  postgres-data:

networks:
  default:
    internal: true
  client:
    driver: bridge
    driver_opts:
      com.docker.network.bridge.enable_ip_masquerade: "false"
