[project]
name = "codeatlas"
version = "0.1.0"
description = "Local, extensible code intelligence over Parquet"
requires-python = ">=3.12"
dependencies = ["pyarrow>=23.0.1,<25", "tree-sitter-language-pack==0.9.0", "boto3>=1.35", "trino>=0.330"]

[project.optional-dependencies]
dev = ["pytest>=8"]
semantic = ["sentence-transformers>=3", "faiss-cpu>=1.9", "numpy>=1.26"]

[project.scripts]
codeatlas = "codeatlas.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = ["integration: pipeline integration tests"]
